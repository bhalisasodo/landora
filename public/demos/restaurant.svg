<svg width="600" height="750" viewBox="0 0 600 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Monolithic Card Container -->
  <rect width="600" height="750" rx="32" fill="#181613"/>
  <rect x="1" y="1" width="598" height="748" rx="31" stroke="#2D2821" stroke-width="1.5"/>

  <!-- Subtle Phone Status Bar -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#D8A76B" letter-spacing="2">RESTAURANT &amp; CAFE • CAPE TOWN</text>
  </g>

  <!-- Business & Single Offer Hero -->
  <g transform="translate(48, 140)">
    <text x="0" y="0" font-family="'Fraunces', Georgia, serif" font-size="36" font-style="italic" font-weight="500" fill="#F5F1E8" letter-spacing="-0.5">Table 9 Bistro &amp; Wine Bar</text>
    <text x="0" y="40" font-family="'Inter Tight', sans-serif" font-size="16" fill="#A89F91">87 Bree Street, Cape Town CBD</text>
  </g>

  <!-- Single Focused Booking Moment Box -->
  <g transform="translate(48, 240)">
    <rect x="0" y="0" width="504" height="240" rx="20" fill="#211E19" stroke="#332D24" stroke-width="1"/>
    
    <text x="32" y="52" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#A89F91" letter-spacing="1.5">TONIGHT'S DINNER SEATING</text>
    <text x="32" y="96" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="600" fill="#F5F1E8">Table for 2 Guests</text>
    <text x="32" y="130" font-family="'Inter Tight', sans-serif" font-size="15" fill="#A89F91">Tonight at 19:30  •  Main Dining  •  No deposit</text>

    <!-- The Single Primary Target -->
    <rect x="32" y="156" width="440" height="54" rx="27" fill="#1F6F4C"/>
    <text x="252" y="190" font-family="'Inter Tight', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Reserve Table for 2 Tonight →</text>
  </g>

  <!-- Quiet Trust Reassurance -->
  <g transform="translate(48, 540)">
    <text x="252" y="0" font-family="'Inter Tight', sans-serif" font-size="13" fill="#A89F91" text-anchor="middle">Instant SMS &amp; WhatsApp confirmation • Table held for 15 min</text>
  </g>

  <!-- Product Signature Mark -->
  <g transform="translate(48, 650)">
    <line x1="0" y1="0" x2="504" y2="0" stroke="#2D2821" stroke-width="1"/>
    <text x="0" y="36" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#6B6357" letter-spacing="1">BUILT BY LAUNCHGREMLIN — ONE LINK TO CLOSE</text>
  </g>
</svg>
