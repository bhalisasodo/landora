<svg width="600" height="750" viewBox="0 0 600 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Monolithic Card Container -->
  <rect width="600" height="750" rx="32" fill="#FBF9F4"/>
  <rect x="1" y="1" width="598" height="748" rx="31" stroke="#E6E0D4" stroke-width="1.5"/>

  <!-- Subtle Phone Status Bar -->
  <g transform="translate(48, 48)">
    <text x="0" y="0" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#1F6F4C" letter-spacing="2">SPA &amp; WELLNESS • CAPE TOWN</text>
  </g>

  <!-- Business & Single Offer Hero -->
  <g transform="translate(48, 140)">
    <text x="0" y="0" font-family="'Fraunces', Georgia, serif" font-size="36" font-style="italic" font-weight="500" fill="#14120F" letter-spacing="-0.5">Aura Botanica Spa</text>
    <text x="0" y="40" font-family="'Inter Tight', sans-serif" font-size="16" fill="#6B6358">142 Kloof Street, Gardens</text>
  </g>

  <!-- Single Focused Booking Moment Box -->
  <g transform="translate(48, 240)">
    <rect x="0" y="0" width="504" height="240" rx="20" fill="#FFFFFF" stroke="#E6E0D4" stroke-width="1"/>
    
    <text x="32" y="52" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="500" fill="#6B6358" letter-spacing="1.5">NEXT AVAILABLE TREATMENT</text>
    <text x="32" y="96" font-family="'Inter Tight', sans-serif" font-size="22" font-weight="600" fill="#14120F">Deep Tissue Muscle Release</text>
    <text x="32" y="130" font-family="'Inter Tight', sans-serif" font-size="15" fill="#6B6358">60 min  •  Today at 15:00  •  R680</text>

    <!-- The Single Primary Target -->
    <rect x="32" y="156" width="440" height="54" rx="27" fill="#1F6F4C"/>
    <text x="252" y="190" font-family="'Inter Tight', sans-serif" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Book for Today 15:00 →</text>
  </g>

  <!-- Quiet Trust Reassurance -->
  <g transform="translate(48, 540)">
    <text x="252" y="0" font-family="'Inter Tight', sans-serif" font-size="13" fill="#6B6358" text-anchor="middle">Instant WhatsApp confirmation • No app or PDF download needed</text>
  </g>

  <!-- Product Signature Mark -->
  <g transform="translate(48, 650)">
    <line x1="0" y1="0" x2="504" y2="0" stroke="#EDE7DC" stroke-width="1"/>
    <text x="0" y="36" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="500" fill="#8C8375" letter-spacing="1">BUILT BY LAUNCHGREMLIN — ONE LINK TO CLOSE</text>
  </g>
</svg>
